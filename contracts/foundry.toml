[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.39"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Tests read/write the shared EIP-712 vectors consumed by the Rust sequencer and the frontend.
fs_permissions = [{ access = "read-write", path = "../fixtures" }, { access = "read-write", path = "../.dev" }, { access = "read-write", path = "../deployments" }, { access = "read", path = "./script" }]

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[lint]
exclude_lints = ["block-timestamp"]

# Dependencies are managed by Soldeer: run `forge soldeer install` after cloning.
[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
solady = "0.1.26"

[soldeer]
remappings_generate = false
