[workspace]
resolver = "2"
members = ["core", "sequencer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-sol-types = { version = "1.7", features = ["eip712-serde", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.105"
thiserror = "2"
